name: Release

# Publishing is deliberately manual-ish: it runs only for an annotated `v*` tag,
# never on a branch push. Pushing a tag is the act of releasing.
on:
  push:
    tags: ['v*']
  # Lets you rehearse the whole job — including `npm publish --dry-run` — without
  # a tag and without publishing anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, test and pack, but do not publish'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # `id-token: write` is what npm provenance needs: npm exchanges that OIDC
    # token for a signed attestation tying the tarball to this commit and this
    # workflow. npm only generates it for a public source repository, which is
    # why the flag was off while this one was private.
    permissions:
      # `write` so the job can create the GitHub Release for the tag it just
      # published.
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      # The tag is the source of truth for what is being released; a tag that
      # disagrees with package.json means someone tagged the wrong commit. Fail
      # before publishing rather than shipping a mislabelled version.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match package.json version $manifest"
            exit 1
          fi

      # Refuse to republish a version that already exists, which npm would reject
      # anyway — but this fails in seconds instead of after the full test run.
      - name: Check the version is unpublished
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published"
            exit 1
          fi
          echo "$name@$version is unpublished"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The gate that matters for a release: proves the tarball this job is about
      # to publish actually installs and runs.
      - name: Packaged install smoke test
        run: npm run test:pack

      - name: End-to-end tests (both templates, node + bun)
        run: npm run test:e2e

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public --provenance

      - name: Publish
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The tag stays the single source of truth for a release; the GitHub
      # Release is written from it, after npm has accepted the package. Doing it
      # in this order means a Release page never advertises a version that failed
      # to publish. Only for real tag pushes — a dispatch has no tag to attach to.
      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "::warning::no CHANGELOG.md section for $version; falling back to generated notes"
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          else
            printf '%s\n' "$notes" | gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file -
          fi
